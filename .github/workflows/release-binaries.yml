name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          out="gpac"
          if [ "$GOOS" = "windows" ]; then out="gpac.exe"; fi
          go build -ldflags="-s -w" -o "$out" ./cmd/gpac

          archive="gpac_${TAG}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            zip "${archive}.zip" "$out"
            echo "ASSET=${archive}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${archive}.tar.gz" "$out"
            echo "ASSET=${archive}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" "${{ env.ASSET }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
